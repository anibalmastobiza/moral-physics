<!DOCTYPE html>
<html>
<head>
    <title>The Active Switch Task</title>
    <script src="https://unpkg.com/jspsych@7.3.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.2"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/jspsych@7.3.3/css/jspsych.css" rel="stylesheet" type="text/css" />

    <style>
        /* Fondo oscuro estilo "Black Mirror" */
        body { background-color: #0f172a; color: #e2e8f0; user-select: none; }
        
        /* Contenedor del Interruptor */
        .switch-track {
            width: 600px;
            height: 80px;
            background: #1e293b;
            border-radius: 40px;
            position: relative;
            margin: 20px auto;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            border: 2px solid #334155;
            overflow: hidden; /* Mantiene todo dentro */
        }

        /* La Manija (Handle) */
        .switch-handle {
            width: 80px;
            height: 80px;
            background: #94a3b8;
            border-radius: 50%;
            position: absolute;
            top: -2px; /* Ajuste fino */
            left: 0;
            cursor: grab;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #0f172a;
            z-index: 10;
            transition: background-color 0.2s;
        }
        .switch-handle:active { cursor: grabbing; background: #f8fafc; }

        /* Barra de Progreso */
        .timer-container { width: 600px; height: 6px; background: #334155; margin: 0 auto 40px auto; border-radius: 3px; }
        .timer-bar { width: 100%; height: 100%; background: #3b82f6; transform-origin: left; transition: transform 0.1s linear; }

        /* Labels */
        .zone-text { font-size: 1.1rem; line-height: 1.2; }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>
</body>

<script>

    // --- CONFIGURACIÓN ---
    const GOOGLE_SCRIPT_URL = "PEGA_AQUI_TU_URL_DE_GOOGLE_APPS_SCRIPT"; 
    const PROLIFIC_COMPLETION_URL = "https://app.prolific.co/submissions/complete?cc=YOUR_CODE";
    // ---------------------

    const jsPsych = initJsPsych({
        display_element: 'jspsych-target'
    });

    const subject_id = jsPsych.data.getURLVariable('PROLIFIC_PID') || 'DEMO_' + Math.floor(Math.random()*100000);
    jsPsych.data.addProperties({ subject_id: subject_id });

    var timeline = [];

    // 1. DEMOGRAPHICS
    // Usamos survey-html-form que es muy estable
    var demographics = {
        type: jsPsychSurveyHtmlForm,
        preamble: '<h2 class="text-2xl font-bold mb-4 text-gray-800">Participant Info</h2>',
        html: `
            <div class="text-left p-4 space-y-4">
                <label class="block">
                    <span class="text-gray-700 font-bold">Age:</span>
                    <input type="number" name="age" required class="w-full p-2 border rounded text-black" min="18" max="99">
                </label>
                <label class="block">
                    <span class="text-gray-700 font-bold">Gender:</span>
                    <select name="gender" required class="w-full p-2 border rounded text-black">
                        <option value="">Select...</option>
                        <option value="Female">Female</option>
                        <option value="Male">Male</option>
                        <option value="Non-binary">Non-binary</option>
                        <option value="Other">Other</option>
                    </select>
                </label>
                <label class="block">
                    <span class="text-gray-700 font-bold">Dominant Hand (Mouse):</span>
                    <select name="handedness" required class="w-full p-2 border rounded text-black">
                        <option value="">Select...</option>
                        <option value="Right">Right</option>
                        <option value="Left">Left</option>
                    </select>
                </label>
            </div>
        `,
        // Importante: forzamos fondo blanco para este plugin específico para que se vea el texto negro
        on_load: function() { document.body.style.backgroundColor = "#f3f4f6"; document.body.style.color = "#000"; },
        on_finish: function() { document.body.style.backgroundColor = "#0f172a"; document.body.style.color = "#e2e8f0"; } // Reset al estilo oscuro
    };
    timeline.push(demographics);

    // 2. INSTRUCTIONS
    var instructions = {
        type: jsPsychHtmlButtonResponse,
        stimulus: `
            <div class="max-w-2xl mx-auto mt-10 p-8 bg-slate-800 rounded-lg shadow-xl border border-slate-700 text-left">
                <h1 class="text-3xl font-bold mb-6 text-blue-400">The Active Switch Task</h1>
                <p class="mb-4 text-lg text-slate-200">This experiment measures <b>Moral Effort</b>.</p>
                <ul class="list-disc pl-6 space-y-3 mb-8 text-slate-300">
                    <li>You will control a slider mechanism.</li>
                    <li>The slider has a default position (Left) and an active position (Right).</li>
                    <li>To choose the Right option, you must <b>DRAG and HOLD</b> the slider against a strong spring.</li>
                    <li>If you let go before the time runs out, it will snap back to the default choice.</li>
                </ul>
                <div class="text-center p-4 bg-slate-900 rounded border border-yellow-600 text-yellow-500 font-bold">
                    This task requires constant physical tension on the mouse.
                </div>
            </div>
        `,
        choices: ['I Understand - Start']
    };
    timeline.push(instructions);

    // 3. THE "ACTIVE SWITCH" TRIAL GENERATOR
    // Esta función devuelve un objeto de trial configurado correctamente
    function createSwitchTrial(scenario_title, left_label, right_label) {
        return {
            type: jsPsychHtmlKeyboardResponse, // Usamos esto para pintar el HTML base
            choices: "NO_KEYS", // El usuario no avanza con teclas, avanza por tiempo
            stimulus: `
                <div class="flex flex-col items-center justify-center pt-10">
                    <h2 class="text-2xl font-bold mb-8 text-slate-200 uppercase tracking-widest">${scenario_title}</h2>
                    
                    <div class="timer-container"><div id="timer-bar" class="timer-bar"></div></div>
                    
                    <div class="flex justify-between w-[600px] mb-2 text-sm font-mono">
                        <div class="w-1/2 text-left pr-4">
                            <div class="text-red-400 font-bold mb-1">DEFAULT STATE</div>
                            <div class="text-slate-400 zone-text">${left_label}</div>
                        </div>
                        <div class="w-1/2 text-right pl-4">
                            <div class="text-emerald-400 font-bold mb-1">ACTIVE INTERVENTION</div>
                            <div class="text-slate-400 zone-text">${right_label}</div>
                        </div>
                    </div>

                    <div class="switch-track" id="track">
                        <div class="switch-handle" id="handle">>>></div>
                    </div>

                    <p class="mt-8 text-slate-500 text-xs">Hold until bar is empty</p>
                </div>
            `,
            // AQUÍ ES DONDE OCURRE LA MAGIA: on_load se ejecuta cuando el HTML ya existe
            on_load: function() {
                // Config
                const DURATION = 5000; // 5 segundos
                const track = document.getElementById('track');
                const handle = document.getElementById('handle');
                const timerBar = document.getElementById('timer-bar');
                
                // Medidas
                const trackWidth = 600;
                const handleWidth = 80;
                const maxDist = trackWidth - handleWidth;

                // Estado
                let isDragging = false;
                let currentX = 0;
                let startTime = performance.now();
                let positionData = [];
                let animFrameId;

                // --- FÍSICA Y CONTROL ---
                
                function updatePos(clientX) {
                    if(!isDragging) return;
                    
                    const rect = track.getBoundingClientRect();
                    let x = clientX - rect.left - (handleWidth / 2);
                    
                    // Clamping (Límites)
                    if(x < 0) x = 0;
                    if(x > maxDist) x = maxDist;
                    
                    currentX = x;
                    render();
                }

                function render() {
                    handle.style.left = currentX + 'px';
                    
                    // Feedback visual: Si está cerca del final, brilla
                    if(currentX > maxDist * 0.9) {
                        handle.style.backgroundColor = '#22c55e'; // Verde
                        handle.style.color = 'white';
                        handle.innerText = "HOLD";
                    } else {
                        handle.style.backgroundColor = '#94a3b8'; // Gris
                        handle.style.color = '#0f172a';
                        handle.innerText = ">>>";
                    }
                }

                // Listeners (Ratón y Touch)
                const startDrag = () => { isDragging = true; };
                const endDrag = () => { 
                    isDragging = false; 
                    // SPRING EFFECT: Snap back instantáneo
                    currentX = 0; 
                    render();
                };
                const moveDrag = (e) => { updatePos(e.clientX || e.touches[0].clientX); };

                handle.addEventListener('mousedown', startDrag);
                window.addEventListener('mouseup', endDrag);
                window.addEventListener('mousemove', moveDrag);
                
                // --- BUCLE PRINCIPAL ---
                function loop() {
                    let now = performance.now();
                    let elapsed = now - startTime;
                    let remaining = DURATION - elapsed;

                    // Actualizar Timer
                    let pct = Math.max(0, remaining / DURATION);
                    timerBar.style.transform = `scaleX(${pct})`;

                    // Guardar datos (Posición normalizada 0.0 a 1.0)
                    positionData.push({
                        t: Math.round(elapsed),
                        p: parseFloat((currentX / maxDist).toFixed(3))
                    });

                    if (remaining > 0) {
                        animFrameId = requestAnimationFrame(loop);
                    } else {
                        finishTrial();
                    }
                }

                function finishTrial() {
                    // Limpieza
                    cancelAnimationFrame(animFrameId);
                    window.removeEventListener('mouseup', endDrag);
                    window.removeEventListener('mousemove', moveDrag);

                    // Resultados
                    // Calculamos "Esfuerzo Medio": Promedio de posición en el tiempo
                    let sum = positionData.reduce((a, b) => a + b.p, 0);
                    let avgEffort = sum / positionData.length;
                    
                    // Si el esfuerzo medio fue alto (> 0.5), consideramos que eligió la opción difícil
                    let choice = avgEffort > 0.5 ? "Active_Right" : "Default_Left";

                    let data = {
                        scenario: scenario_title,
                        choice: choice,
                        avg_effort: avgEffort,
                        trajectory: JSON.stringify(positionData)
                    };

                    jsPsych.finishTrial(data);
                }

                // Iniciar
                loop();
            }
        };
    }

    // --- DEFINICIÓN DE DILEMAS ---

    // Dilema 1: El Tranvía por Inercia
    timeline.push(createSwitchTrial(
        "The Runaway Train",
        "DO NOTHING<br>Train kills 5 people",
        "PULL & HOLD<br>Train kills 1 person"
    ));

    // Dilema 2: Dinero vs Caridad
    timeline.push(createSwitchTrial(
        "The Donation",
        "KEEP IT<br>Keep $100 bonus",
        "DONATE IT<br>Give to charity"
    ));

    // 4. GUARDADO DE DATOS (Fail-Safe)
    var save_screen = {
        type: jsPsychHtmlKeyboardResponse,
        choices: "NO_KEYS",
        stimulus: `
            <div class="text-center mt-20">
                <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <h2 class="text-xl">Saving Data...</h2>
            </div>
        `,
        on_load: function() {
            var data = jsPsych.data.get().json();
            
            // Enviamos sin esperar respuesta (Fire & Forget)
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: data
            });

            // Forzamos avanzar tras 2 segundos (Aunque Google falle)
            setTimeout(function() {
                jsPsych.finishTrial();
            }, 2000);
        }
    };
    timeline.push(save_screen);

    // 5. FIN
    var end_screen = {
        type: jsPsychHtmlButtonResponse,
        stimulus: `
            <div class="p-10">
                <h2 class="text-3xl text-emerald-400 mb-4">Experiment Completed</h2>
                <p class="mb-6">Thank you for your participation.</p>
            </div>
        `,
        choices: ['Return to Prolific'],
        on_finish: function() {
            window.location = PROLIFIC_COMPLETION_URL;
        }
    };
    timeline.push(end_screen);

    jsPsych.run(timeline);

</script>
</html>
