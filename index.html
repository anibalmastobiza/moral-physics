<!DOCTYPE html>
<html>
<head>
    <title>The Moral Kinematics Task</title>
    <script src="https://unpkg.com/jspsych@7.3.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script> 
    <link href="https://unpkg.com/jspsych@7.3.3/css/jspsych.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { background-color: #f3f4f6; user-select: none; overflow: hidden; }
        #arena-container { 
            position: relative; 
            width: 800px; 
            height: 600px; 
            margin: 20px auto; 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            cursor: none; /* Hide cursor inside arena */
        }
        input, select { border: 1px solid #ccc; padding: 4px; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>
</body>

<script>

    // -----------------------------------------------------------
    // CONFIGURATION
    // -----------------------------------------------------------
    const GOOGLE_SCRIPT_URL = "PASTE_YOUR_GOOGLE_WEB_APP_URL_HERE"; 
    const PROLIFIC_COMPLETION_URL = "https://app.prolific.co/submissions/complete?cc=YOUR_CODE";
    // -----------------------------------------------------------

    const jsPsych = initJsPsych({
        display_element: 'jspsych-target'
    });

    const subject_id = jsPsych.data.getURLVariable('PROLIFIC_PID') || 'TEST_' + Math.floor(Math.random()*10000);
    jsPsych.data.addProperties({ subject_id: subject_id });

    var timeline = [];

    // --- 1. INSTRUCTIONS ---
    var instructions = {
        type: jsPsychHtmlButtonResponse,
        stimulus: `
            <div class="p-8 max-w-2xl mx-auto">
                <h2 class="text-3xl font-bold mb-6 text-gray-800">The Moral Kinematics Task</h2>
                <div class="bg-white p-6 rounded shadow mb-6 text-left">
                    <p class="mb-4">You are about to interact with a physical object.</p>
                    <ul class="list-disc pl-5 mb-4 space-y-2">
                        <li><b>Goal:</b> Drag the Blue Circle to one of the choices.</li>
                        <li><b>The Red Line:</b> Represents your intention.</li>
                        <li><b>IMPORTANT:</b> To start each trial, you must move your mouse to the <span class="text-gray-500 font-bold">Gray Center Circle</span>.</li>
                    </ul>
                </div>
            </div>
        `,
        choices: ['Start']
    };
    timeline.push(instructions);

    // --- 2. PHYSICS ENGINE V3 (With "Start Zone" fix) ---
    var physics_trial = {
        type: jsPsychCallFunction,
        async: true,
        func: function(done) {
            const display = document.getElementById('jspsych-target');
            display.innerHTML = `
                <div id="arena-container">
                    <canvas id="moralCanvas" width="800" height="600"></canvas>
                    <div id="msg-overlay" class="absolute top-4 w-full text-center pointer-events-none select-none">
                        <span class="text-xl font-bold text-gray-400">Move mouse to center to start</span>
                    </div>
                </div>
            `;

            const canvas = document.getElementById('moralCanvas');
            const ctx = canvas.getContext('2d');
            
            // Experimental Vars
            const condition = Math.random() > 0.5 ? 'high_friction' : 'low_friction';
            const springStiffness = condition === 'high_friction' ? 0.03 : 0.15; 
            const friction = 0.85; 

            // State
            let startX = 400, startY = 500; // Agent starts bottom-center
            let centerZone = { x: 400, y: 300, r: 50 }; // Where user must go to start
            
            let mouse = { x: 400, y: 300 }; 
            let agent = { x: startX, y: startY, vx: 0, vy: 0 };
            
            let trajectory = [];
            let isInteract = false;
            let trialRunning = true;
            let hasStarted = false; // "Start Zone" flag
            let startTime = 0;

            const targetSelf = { x: 150, y: 150, r: 70, label: "KEEP ($10)", color: "#ef4444" }; 
            const targetShare = { x: 650, y: 150, r: 70, label: "SHARE ($5/$5)", color: "#22c55e" }; 

            function updateMouse(e) {
                const rect = canvas.getBoundingClientRect();
                mouse.x = e.clientX - rect.left;
                mouse.y = e.clientY - rect.top;
            }
            document.addEventListener('mousemove', updateMouse);

            function loop() {
                if (!trialRunning) return;

                // LOGIC: Check if user has entered the "Start Zone"
                if (!hasStarted) {
                    let distToCenter = Math.hypot(mouse.x - centerZone.x, mouse.y - centerZone.y);
                    if (distToCenter < centerZone.r) {
                        hasStarted = true;
                        startTime = performance.now();
                        isInteract = true;
                        document.getElementById('msg-overlay').innerHTML = '<span class="text-xl font-bold text-gray-700">GO!</span>';
                    }
                }

                // PHYSICS (Only runs after start)
                if (hasStarted) {
                    let dx = mouse.x - agent.x;
                    let dy = mouse.y - agent.y;
                    let ax = dx * springStiffness;
                    let ay = dy * springStiffness;

                    agent.vx = (agent.vx + ax) * friction;
                    agent.vy = (agent.vy + ay) * friction;
                    agent.x += agent.vx;
                    agent.y += agent.vy;

                    trajectory.push({
                        t: Math.round(performance.now() - startTime),
                        ax: Math.round(agent.x), ay: Math.round(agent.y),
                        mx: Math.round(mouse.x), my: Math.round(mouse.y)
                    });
                }

                render();
                
                if (hasStarted) checkWin();
                
                requestAnimationFrame(loop);
            }

            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw Targets
                drawTarget(targetSelf);
                drawTarget(targetShare);

                // Draw START ZONE (if not started)
                if (!hasStarted) {
                    ctx.beginPath();
                    ctx.arc(centerZone.x, centerZone.y, centerZone.r, 0, Math.PI * 2);
                    ctx.fillStyle = "#e5e7eb"; // Gray
                    ctx.fill();
                    ctx.strokeStyle = "#9ca3af";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = "#6b7280";
                    ctx.font = "bold 14px sans-serif";
                    ctx.textAlign = "center";
                    ctx.fillText("START HERE", centerZone.x, centerZone.y + 5);
                }

                // Draw Tether (Only if started)
                if (hasStarted) {
                    ctx.beginPath();
                    ctx.moveTo(agent.x, agent.y);
                    ctx.lineTo(mouse.x, mouse.y);
                    let dist = Math.hypot(mouse.x - agent.x, mouse.y - agent.y);
                    let tensionColor = dist > 200 ? "rgba(255,0,0,0.6)" : "rgba(0,0,0,0.2)";
                    ctx.strokeStyle = tensionColor;
                    ctx.lineWidth = 3;
                    ctx.setLineDash([5, 5]); 
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                // Draw Agent
                ctx.beginPath();
                ctx.arc(agent.x, agent.y, 20, 0, Math.PI * 2);
                ctx.fillStyle = hasStarted ? "#2563eb" : "#9ca3af"; // Blue if active, Gray if waiting
                ctx.fill();

                // Draw Mouse
                ctx.beginPath();
                ctx.arc(mouse.x, mouse.y, 8, 0, Math.PI * 2);
                ctx.strokeStyle = "#ef4444"; 
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            function drawTarget(t) {
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
                ctx.fillStyle = t.color + "22"; 
                ctx.fill();
                ctx.strokeStyle = t.color;
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = "#333";
                ctx.font = "bold 14px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(t.label, t.x, t.y);
            }

            function checkWin() {
                if (Math.hypot(agent.x - targetSelf.x, agent.y - targetSelf.y) < 30) finishTrial('selfish');
                else if (Math.hypot(agent.x - targetShare.x, agent.y - targetShare.y) < 30) finishTrial('altruistic');
            }

            function finishTrial(outcome) {
                if (!trialRunning) return;
                trialRunning = false; 
                document.removeEventListener('mousemove', updateMouse);

                const ctx = document.getElementById('moralCanvas').getContext('2d');
                ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
                ctx.fillRect(0, 0, 800, 600);
                ctx.fillStyle = "black";
                ctx.font = "30px sans-serif";
                ctx.fillText("Recorded: " + outcome.toUpperCase(), 400, 300);

                // Calculate metrics
                let avg_tension = trajectory.length > 0 ? 
                    trajectory.reduce((acc, p) => acc + Math.hypot(p.mx-p.ax, p.my-p.ay), 0) / trajectory.length : 0;

                var data = {
                    condition: condition,
                    outcome: outcome,
                    rt: performance.now() - startTime,
                    avg_moral_tension: avg_tension, 
                    trajectory: JSON.stringify(trajectory) 
                };

                setTimeout(() => { jsPsych.finishTrial(data); }, 800);
            }

            loop();
        }
    };

    var loop_trials = {
        timeline: [physics_trial],
        loop_function: function() {
            var trials_run = jsPsych.data.get().filter({trial_type: 'call-function'}).count();
            return trials_run < 3; // 3 Trials for testing
        }
    };
    timeline.push(loop_trials);

    // --- 3. DEMOGRAPHICS ---
    var demographics = {
        type: jsPsychSurveyHtmlForm,
        preamble: '<h3 class="text-xl font-bold mb-4">Demographics</h3>',
        html: `
            <div class="text-left bg-white p-6 rounded shadow max-w-md mx-auto space-y-4">
                <label class="block">
                    <span class="text-gray-700">Age:</span>
                    <input name="age" type="number" required class="mt-1 block w-full" min="18" max="99">
                </label>
                <label class="block">
                    <span class="text-gray-700">Gender:</span>
                    <select name="gender" required class="mt-1 block w-full">
                        <option value="">Select...</option>
                        <option value="female">Female</option>
                        <option value="male">Male</option>
                        <option value="non-binary">Non-binary</option>
                        <option value="other">Other</option>
                    </select>
                </label>
            </div>
        `,
        button_label: 'Continue'
    };
    timeline.push(demographics);

    // --- 4. DATA SAVING (FAIL-SAFE VERSION) ---
    // This trial will last exactly 3000ms. It sends data in background.
    // It does NOT wait for success. It just moves on.
    var save_data = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `
            <div class="text-center mt-20">
                <h2 class="text-2xl font-bold text-gray-800">Saving Data...</h2>
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-gray-900 mx-auto mt-4"></div>
                <p class="text-gray-500 mt-4">Please wait a moment.</p>
            </div>
        `,
        choices: "NO_KEYS",
        trial_duration: 3000, // Force advance after 3 seconds
        on_load: function() {
            var data_to_save = jsPsych.data.get().json();
            
            // "Fire and Forget" fetch
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: data_to_save
            });
        }
    };
    timeline.push(save_data);

    // --- 5. END SCREEN ---
    var end_screen = {
        type: jsPsychHtmlButtonResponse,
        stimulus: "<h3>Experiment Completed!</h3><p>Thank you.</p>",
        choices: ['Click to finish'],
        on_finish: function() {
            window.location = PROLIFIC_COMPLETION_URL;
        }
    };
    timeline.push(end_screen);

    jsPsych.run(timeline);

</script>
</html>
