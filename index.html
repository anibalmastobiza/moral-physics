<!DOCTYPE html>
<html>
<head>
    <title>The Active Switch Paradigm</title>
    <script src="https://unpkg.com/jspsych@7.3.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.2"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/jspsych@7.3.3/css/jspsych.css" rel="stylesheet" type="text/css" />

    <style>
        body { background-color: #1a1a1a; color: white; user-select: none; overflow: hidden; }
        
        /* El "Rail" del Interruptor */
        .switch-track {
            width: 600px;
            height: 80px;
            background: #333;
            border-radius: 40px;
            position: relative;
            margin: 0 auto;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            border: 2px solid #555;
        }

        /* La Manija que arrastras */
        .switch-handle {
            width: 80px;
            height: 80px;
            background: #e5e7eb; /* Gris claro */
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 0; /* Empieza a la izquierda */
            cursor: grab;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #333;
        }
        .switch-handle:active { cursor: grabbing; background: #fff; }

        /* Zonas de Decisión */
        .zone-label { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; }
        .zone-left { color: #ef4444; } /* Red */
        .zone-right { color: #22c55e; } /* Green */
        
        /* Barra de Progreso (Tiempo) */
        #progress-container { width: 600px; height: 10px; background: #333; margin: 20px auto; border-radius: 5px; overflow: hidden;}
        #progress-bar { width: 100%; height: 100%; background: #3b82f6; transform-origin: left; transform: scaleX(1); transition: transform 0.1s linear; }

        /* Estilos formulario */
        .survey-box { background: white; color: black; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; text-align: left; }
        .survey-box input, .survey-box select { border: 1px solid #ccc; padding: 8px; width: 100%; margin-top: 5px; border-radius: 4px; }
        .survey-box label { display: block; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>
</body>

<script>

    // --- CONFIGURACIÓN CRÍTICA ---
    const GOOGLE_SCRIPT_URL = "PEGA_AQUI_TU_URL_DE_GOOGLE_APPS_SCRIPT"; 
    const PROLIFIC_COMPLETION_URL = "https://app.prolific.co/submissions/complete?cc=YOUR_CODE";
    // -----------------------------

    const jsPsych = initJsPsych({
        display_element: 'jspsych-target'
    });

    // Prolific ID Capture
    const subject_id = jsPsych.data.getURLVariable('PROLIFIC_PID') || 'DEMO_' + Math.floor(Math.random()*100000);
    jsPsych.data.addProperties({ subject_id: subject_id });

    var timeline = [];

    // -------------------------------------------------------------
    // 1. DEMOGRÁFICOS (Ahora con estilo visual claro)
    // -------------------------------------------------------------
    var demographics = {
        type: jsPsychSurveyHtmlForm,
        preamble: '<h2 class="text-2xl font-bold mb-4 text-white">Participant Info</h2>',
        html: `
            <div class="survey-box">
                <label>Age:
                    <input type="number" name="age" required min="18" max="99">
                </label>
                <label>Gender:
                    <select name="gender" required>
                        <option value="">Select...</option>
                        <option value="Female">Female</option>
                        <option value="Male">Male</option>
                        <option value="Non-binary">Non-binary</option>
                        <option value="Other">Other</option>
                    </select>
                </label>
                <label>Dominant Hand (Mouse):
                    <select name="handedness" required>
                        <option value="">Select...</option>
                        <option value="Right">Right</option>
                        <option value="Left">Left</option>
                    </select>
                </label>
            </div>
        `,
        button_label: 'Continue to Experiment',
        on_finish: function(data){
            // Flatten responses for clean CSV
            let responses = JSON.parse(data.responses);
            jsPsych.data.addProperties(responses); 
        }
    };
    timeline.push(demographics);

    // -------------------------------------------------------------
    // 2. INSTRUCCIONES
    // -------------------------------------------------------------
    var instructions = {
        type: jsPsychHtmlButtonResponse,
        stimulus: `
            <div class="max-w-2xl mx-auto mt-10 p-6 bg-gray-800 rounded-lg shadow-xl border border-gray-700">
                <h1 class="text-3xl font-bold mb-4 text-blue-400">The Active Switch Task</h1>
                <p class="mb-4 text-lg">You are the operator of a fail-safe mechanism.</p>
                <ul class="list-disc text-left pl-8 space-y-2 mb-6 text-gray-300">
                    <li>A slider will appear on screen. It controls an outcome.</li>
                    <li>The slider has a powerful <b>spring</b>. It wants to stay on the LEFT.</li>
                    <li>To choose the RIGHT option, you must <b>drag it and HOLD it</b> there against the resistance.</li>
                    <li>If you let go, it will snap back instantly.</li>
                    <li>You must maintain your choice until the timer runs out (5 seconds).</li>
                </ul>
                <p class="text-yellow-400 font-bold">This task requires constant physical effort.</p>
            </div>
        `,
        choices: ['I Understand - Start']
    };
    timeline.push(instructions);

    // -------------------------------------------------------------
    // 3. THE ACTIVE SWITCH PLUGIN (Custom Logic)
    // -------------------------------------------------------------
    
    // Función generadora de ensayos
    function createSwitchTrial(scenario_name, left_text, right_text) {
        return {
            type: jsPsychCallFunction,
            async: true,
            func: function(done) {
                // Setup HTML
                const display = document.getElementById('jspsych-target');
                display.innerHTML = `
                    <div class="flex flex-col items-center justify-center min-h-screen">
                        <h2 class="text-3xl font-bold mb-10 text-gray-200">${scenario_name}</h2>

                        <div id="progress-container"><div id="progress-bar"></div></div>
                        <p class="text-sm text-gray-500 mb-10">Hold your choice until the bar empties</p>

                        <div class="flex justify-between w-[800px] mb-2 px-10">
                            <div class="zone-label zone-left w-1/3 text-left">${left_text}<br><span class="text-xs text-gray-500">(Default State)</span></div>
                            <div class="zone-label zone-right w-1/3 text-right">${right_text}<br><span class="text-xs text-gray-500">(Requires Effort)</span></div>
                        </div>

                        <div class="switch-track" id="track">
                            <div class="switch-handle" id="handle">DRAG</div>
                        </div>
                    </div>
                `;

                // --- LOGIC VARIABLES ---
                const track = document.getElementById('track');
                const handle = document.getElementById('handle');
                const progressBar = document.getElementById('progress-bar');
                
                const DURATION = 5000; // 5 seconds trial
                const TRACK_WIDTH = 600;
                const HANDLE_WIDTH = 80;
                const MAX_X = TRACK_WIDTH - HANDLE_WIDTH;
                
                let isDragging = false;
                let currentX = 0; // 0 = Left (Default), MAX_X = Right (Active)
                let startTime = performance.now();
                let timeRemaining = DURATION;
                
                // DATA RECORDING
                let positionData = []; // Records position every frame
                
                // MOUSE EVENTS
                function onMove(e) {
                    if (!isDragging) return;
                    
                    // Calculate X relative to track
                    const rect = track.getBoundingClientRect();
                    let clientX = e.clientX || e.touches[0].clientX;
                    let newX = clientX - rect.left - (HANDLE_WIDTH / 2);

                    // Clamp values (Keep inside track)
                    if (newX < 0) newX = 0;
                    if (newX > MAX_X) newX = MAX_X;

                    currentX = newX;
                    updateVisuals();
                }

                function onDown(e) {
                    isDragging = true;
                    handle.textContent = "HOLD";
                    handle.style.background = "white";
                }

                function onUp(e) {
                    isDragging = false;
                    handle.textContent = "DRAG";
                    handle.style.background = "#e5e7eb";
                    // SPRING PHYSICS: Snap back immediately if released
                    currentX = 0; 
                    updateVisuals();
                }

                // Attach Listeners
                handle.addEventListener('mousedown', onDown);
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
                // Touch support
                handle.addEventListener('touchstart', onDown);
                window.addEventListener('touchmove', onMove);
                window.addEventListener('touchend', onUp);

                function updateVisuals() {
                    handle.style.left = currentX + 'px';
                    
                    // Dynamic Background Color based on position
                    // Left (0) is dark, Right (MAX) is slightly illuminted
                    let intensity = (currentX / MAX_X) * 0.3;
                    document.body.style.backgroundColor = `rgba(34, 197, 94, ${intensity})`; // Greenish tint if active
                }

                // MAIN LOOP
                function loop() {
                    let now = performance.now();
                    let elapsed = now - startTime;
                    timeRemaining = Math.max(0, DURATION - elapsed);

                    // Update Progress Bar
                    let pct = timeRemaining / DURATION;
                    progressBar.style.transform = `scaleX(${pct})`;

                    // Record Data (Where is the user?)
                    // We normalize position: 0.0 (Left/Deont) to 1.0 (Right/Util)
                    let normalizedPos = currentX / MAX_X;
                    positionData.push({
                        t: Math.round(elapsed),
                        pos: parseFloat(normalizedPos.toFixed(3))
                    });

                    if (timeRemaining > 0) {
                        requestAnimationFrame(loop);
                    } else {
                        finish();
                    }
                }

                function finish() {
                    // Cleanup
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                    
                    // Determine Final Choice (Last Position)
                    let finalScore = currentX / MAX_X;
                    let outcome = finalScore > 0.5 ? 'Right (Active)' : 'Left (Default)';

                    // Calculate "Effort" (Area Under Curve)
                    // How much time did they spend holding the difficult option?
                    let effortSum = positionData.reduce((acc, p) => acc + p.pos, 0);
                    let avgEffort = effortSum / positionData.length;

                    // Save Data
                    let data = {
                        scenario: scenario_name,
                        outcome: outcome,
                        avg_effort: avgEffort, // 0 = Never touched, 1 = Held perfectly whole time
                        trajectory: JSON.stringify(positionData) // Temporal dynamics
                    };

                    // Reset styling
                    document.body.style.backgroundColor = '#1a1a1a';
                    
                    jsPsych.finishTrial(data);
                }

                // Start
                loop();
            }
        };
    }

    // --- DEFINICIÓN DE ENSAYOS ---
    
    // Ensayo 1: Clásico Trolley (Modificado para ser de esfuerzo)
    // Left (Default): Do Nothing -> 5 die.
    // Right (Effort): Pull Switch -> 1 dies.
    // Tienes que MANTENER el interruptor para matar al 1 y salvar a los 5.
    timeline.push(createSwitchTrial(
        "DILEMMA 1: The Runaway Train",
        "DO NOTHING<br>5 People Die",
        "HOLD SWITCH<br>Kill 1 to Save 5"
    ));

    // Ensayo 2: Inverso (Sacrificio propio)
    // Left (Default): Keep Money.
    // Right (Effort): Donate Everything.
    timeline.push(createSwitchTrial(
        "DILEMMA 2: The Bonus",
        "KEEP IT<br>Gain $100",
        "DONATE IT<br>Help Charity"
    ));
    
    // Puedes añadir más aquí...

    // -------------------------------------------------------------
    // 4. GUARDADO ROBUSTO (FIRE AND FORGET)
    // -------------------------------------------------------------
    var save_data = {
        type: jsPsychCallFunction,
        async: true,
        func: function(done){
            // Show feedback
            document.getElementById('jspsych-target').innerHTML = `
                <div class="flex flex-col items-center justify-center h-screen">
                    <h2 class="text-2xl font-bold mb-4">Saving Data...</h2>
                    <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                </div>
            `;
            
            var data = jsPsych.data.get().json();
            
            // 1. Send Data (Don't wait for response)
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: 'no-cors', // Crucial for stability
                headers: { 'Content-Type': 'application/json' },
                body: data
            });

            // 2. Force Advance after 2 seconds no matter what
            setTimeout(function(){
                done();
            }, 2000);
        }
    };
    timeline.push(save_data);

    // -------------------------------------------------------------
    // 5. FINAL
    // -------------------------------------------------------------
    var end_screen = {
        type: jsPsychHtmlButtonResponse,
        stimulus: `
            <div class="p-10">
                <h2 class="text-3xl text-green-400 mb-4">Success!</h2>
                <p class="text-white mb-6">Your data has been sent.</p>
                <p>You can now complete the submission on Prolific.</p>
            </div>
        `,
        choices: ['Redirect to Prolific'],
        on_finish: function() {
            window.location = PROLIFIC_COMPLETION_URL;
        }
    };
    timeline.push(end_screen);

    // INICIAR
    jsPsych.run(timeline);

</script>
</html>
