<!DOCTYPE html>
<html>
<head>
    <title>The Active Switch Paradigm</title>
    <script src="https://unpkg.com/jspsych@7.3.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/jspsych@7.3.3/css/jspsych.css" rel="stylesheet" type="text/css" />

    <style>
        body { background-color: #0f172a; color: #e2e8f0; user-select: none; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        /* Contenedor del Interruptor */
        .switch-track {
            width: 600px;
            height: 80px;
            background: #1e293b;
            border-radius: 40px;
            position: relative;
            margin: 40px auto;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            border: 2px solid #334155;
            overflow: hidden; 
        }

        /* La Manija (Handle) */
        .switch-handle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            position: absolute;
            top: -2px; 
            left: 0;
            cursor: grab;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #0f172a;
            z-index: 10;
            transition: background-color 0.2s, opacity 0.2s;
        }
        /* Estado bloqueado (Lectura) */
        .handle-locked { background: #475569; cursor: not-allowed; opacity: 0.5; color: #94a3b8; }
        /* Estado activo */
        .handle-active { background: #94a3b8; cursor: grab; opacity: 1; }
        .handle-active:active { cursor: grabbing; background: #f8fafc; }

        .timer-container { width: 600px; height: 8px; background: #334155; margin: 0 auto 20px auto; border-radius: 4px; overflow: hidden; }
        .timer-bar { width: 100%; height: 100%; background: #3b82f6; transform-origin: left; transform: scaleX(1); }
        
        #error-console { display: none; position: fixed; top: 0; left: 0; width: 100%; background: red; color: white; padding: 10px; z-index: 9999; text-align: center; }
    </style>
</head>
<body>
    <div id="error-console"></div>
    <div id="jspsych-target"></div>
</body>

<script>
    // --- CHIVATO DE ERRORES ---
    window.onerror = function(msg, url, line) {
        var errBox = document.getElementById('error-console');
        errBox.style.display = 'block';
        errBox.innerHTML = "ERROR: " + msg + " (Line " + line + ")";
        return false;
    };

    // --- CONFIGURACIÓN ---
    const GOOGLE_SCRIPT_URL = "PEGA_AQUI_TU_URL_DE_GOOGLE_APPS_SCRIPT"; 
    const PROLIFIC_COMPLETION_URL = "https://app.prolific.co/submissions/complete?cc=TU_CODIGO";
    // ---------------------

    const jsPsych = initJsPsych({
        display_element: 'jspsych-target'
    });

    const subject_id = jsPsych.data.getURLVariable('PROLIFIC_PID') || 'DEMO_' + Math.floor(Math.random()*100000);
    jsPsych.data.addProperties({ subject_id: subject_id });

    var timeline = [];

    // 1. DEMOGRÁFICOS
    var demographics = {
        type: jsPsychSurveyHtmlForm,
        preamble: '<h2 class="text-2xl font-bold mb-4 text-black">Participant Info</h2>',
        html: `
            <div class="text-left p-4 space-y-4 text-black">
                <label class="block"><span class="font-bold">Age:</span><input type="number" name="age" required class="w-full p-2 border rounded" min="18" max="99"></label>
                <label class="block"><span class="font-bold">Gender:</span><select name="gender" required class="w-full p-2 border rounded"><option value="">Select...</option><option value="Female">Female</option><option value="Male">Male</option><option value="Other">Other</option></select></label>
                <label class="block"><span class="font-bold">Handedness:</span><select name="handedness" required class="w-full p-2 border rounded"><option value="">Select...</option><option value="Right">Right</option><option value="Left">Left</option></select></label>
            </div>
        `,
        on_load: function() { 
            document.body.style.backgroundColor = "#f3f4f6"; 
            document.getElementById('jspsych-target').style.color = "black";
        },
        on_finish: function() { 
            document.body.style.backgroundColor = "#0f172a"; 
            document.getElementById('jspsych-target').style.color = "#e2e8f0";
        }
    };
    timeline.push(demographics);

    // 2. INSTRUCCIONES
    var instructions = {
        type: jsPsychHtmlButtonResponse,
        stimulus: `
            <div class="max-w-2xl mx-auto mt-10 p-8 bg-slate-800 rounded-lg border border-slate-700 text-left">
                <h1 class="text-3xl font-bold mb-6 text-blue-400">The Active Switch Task</h1>
                <ul class="list-disc pl-6 space-y-3 mb-8 text-slate-300">
                    <li><b>Read First:</b> The switch will be <span class="text-gray-500 font-bold">LOCKED</span> for 3 seconds while you read.</li>
                    <li><b>Act Fast:</b> When it turns <span class="text-white font-bold">WHITE</span>, the timer starts.</li>
                    <li><b>Drag & Hold:</b> To choose the active option, you must hold the slider against the resistance.</li>
                </ul>
            </div>
        `,
        choices: ['I Understand - Start']
    };
    timeline.push(instructions);

    // 3. TRIAL GENERATOR (CON FASE DE LECTURA)
    function createSwitchTrial(scenario_title, left_label, right_label) {
        return {
            type: jsPsychHtmlKeyboardResponse, 
            choices: "NO_KEYS", 
            stimulus: `
                <div class="flex flex-col items-center justify-center pt-10 w-full h-full">
                    <h2 class="text-2xl font-bold mb-2 text-slate-200 uppercase tracking-widest">${scenario_title}</h2>
                    <div id="status-msg" class="h-6 text-sm font-bold text-yellow-500 mb-2">READING...</div>
                    
                    <div class="timer-container"><div id="timer-bar" class="timer-bar"></div></div>
                    
                    <div class="flex justify-between w-[600px] mb-2 text-sm font-mono">
                        <div class="w-1/2 text-left pr-4"><div class="text-red-400 font-bold mb-1">DEFAULT</div><div class="text-slate-400 zone-text">${left_label}</div></div>
                        <div class="w-1/2 text-right pl-4"><div class="text-emerald-400 font-bold mb-1">INTERVENTION</div><div class="text-slate-400 zone-text">${right_label}</div></div>
                    </div>

                    <div class="switch-track" id="track">
                        <div class="switch-handle handle-locked" id="handle"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg></div>
                    </div>

                    <p class="mt-8 text-slate-500 text-xs">Wait for unlock...</p>
                </div>
            `,
            on_load: function() {
                const track = document.getElementById('track');
                const handle = document.getElementById('handle');
                const timerBar = document.getElementById('timer-bar');
                const statusMsg = document.getElementById('status-msg');

                const READING_TIME = 3000; // 3 segundos para leer
                const ACTION_TIME = 5000;  // 5 segundos para actuar
                const trackWidth = 600;
                const handleWidth = 80;
                const maxDist = trackWidth - handleWidth;
                
                let isDragging = false;
                let currentX = 0;
                let startTime = performance.now();
                let positionData = [];
                let animationId;
                let phase = 'READING'; // READING | ACTION

                function updatePosition(clientX) {
                    if (!isDragging || phase === 'READING') return;
                    const rect = track.getBoundingClientRect();
                    let x = clientX - rect.left - (handleWidth / 2);
                    if (x < 0) x = 0; if (x > maxDist) x = maxDist;
                    currentX = x;
                    render();
                }

                function render() {
                    handle.style.left = currentX + 'px';
                    if (phase === 'ACTION') {
                        if (currentX > maxDist * 0.9) {
                            handle.style.backgroundColor = '#22c55e'; 
                            handle.style.color = 'white';
                            handle.innerText = "HOLD";
                        } else {
                            handle.style.backgroundColor = '#f1f5f9'; 
                            handle.style.color = '#0f172a';
                            handle.innerText = ">>>";
                        }
                    }
                }

                const startDrag = () => { if(phase === 'ACTION') isDragging = true; };
                const endDrag = () => { isDragging = false; currentX = 0; render(); };
                const onMouseMove = (e) => updatePosition(e.clientX);
                const onTouchMove = (e) => updatePosition(e.touches[0].clientX);

                handle.addEventListener('mousedown', startDrag);
                window.addEventListener('mouseup', endDrag);
                window.addEventListener('mousemove', onMouseMove);
                handle.addEventListener('touchstart', startDrag);
                window.addEventListener('touchend', endDrag);
                window.addEventListener('touchmove', onTouchMove);

                function loop() {
                    let now = performance.now();
                    let totalElapsed = now - startTime;

                    // --- FASE 1: LECTURA ---
                    if (totalElapsed < READING_TIME) {
                        phase = 'READING';
                        timerBar.style.width = '100%'; // Barra llena
                        timerBar.style.backgroundColor = '#64748b'; // Gris
                        // Bloquear visualmente
                        handle.className = "switch-handle handle-locked";
                        statusMsg.innerText = "READING SCENARIO...";
                        statusMsg.className = "h-6 text-sm font-bold text-gray-500 mb-2";
                    } 
                    // --- FASE 2: ACCIÓN ---
                    else if (totalElapsed < (READING_TIME + ACTION_TIME)) {
                        phase = 'ACTION';
                        let actionElapsed = totalElapsed - READING_TIME;
                        let remaining = ACTION_TIME - actionElapsed;
                        let pct = Math.max(0, remaining / ACTION_TIME);
                        
                        timerBar.style.width = (pct * 100) + '%';
                        timerBar.style.backgroundColor = '#3b82f6'; // Azul
                        
                        // Desbloquear visualmente (solo una vez)
                        if (handle.classList.contains('handle-locked')) {
                            handle.className = "switch-handle handle-active";
                            handle.innerHTML = ">>>"; // Quitar candado
                        }
                        statusMsg.innerText = "ACT NOW!";
                        statusMsg.className = "h-6 text-sm font-bold text-emerald-400 mb-2 animate-pulse";

                        // Guardar datos
                        positionData.push({
                            t: Math.round(actionElapsed),
                            p: parseFloat((currentX / maxDist).toFixed(3))
                        });
                    } 
                    // --- FIN ---
                    else {
                        finish();
                        return;
                    }
                    
                    animationId = requestAnimationFrame(loop);
                }

                function finish() {
                    cancelAnimationFrame(animationId);
                    window.removeEventListener('mouseup', endDrag);
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('touchend', endDrag);
                    window.removeEventListener('touchmove', onTouchMove);

                    let avgEffort = positionData.length > 0 ? positionData.reduce((acc, val) => acc + val.p, 0) / positionData.length : 0;
                    let outcome = avgEffort > 0.5 ? "Active_Intervention" : "Default_Inaction";

                    jsPsych.finishTrial({
                        scenario: scenario_title,
                        outcome: outcome,
                        avg_effort: avgEffort,
                        trajectory: JSON.stringify(positionData)
                    });
                }

                loop();
            }
        };
    }

    // --- DILEMAS ---
    timeline.push(createSwitchTrial("Dilemma 1: The Train", "Do Nothing<br>(5 Die)", "Pull Switch<br>(1 Dies)"));
    timeline.push(createSwitchTrial("Dilemma 2: The Bonus", "Keep Money<br>(+$100)", "Donate All<br>(Charity)"));

    // 4. GUARDADO
    var save_screen = {
        type: jsPsychHtmlKeyboardResponse,
        choices: "NO_KEYS",
        stimulus: `<div class="text-center mt-20"><div class="animate-spin text-4xl mb-4">⏳</div><h2>Saving Data...</h2></div>`,
        on_load: function() {
            var data = jsPsych.data.get().json();
            fetch(GOOGLE_SCRIPT_URL, { method: "POST", mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: data });
            setTimeout(function() { jsPsych.finishTrial(); }, 2000);
        }
    };
    timeline.push(save_screen);

    // 5. FIN
    var end_screen = {
        type: jsPsychHtmlButtonResponse,
        stimulus: `<div class="p-10"><h2 class="text-3xl text-emerald-400 mb-4">Done!</h2></div>`,
        choices: ['Finish'],
        on_finish: function() { window.location = PROLIFIC_COMPLETION_URL; }
    };
    timeline.push(end_screen);

    jsPsych.run(timeline);

</script>
</html>
