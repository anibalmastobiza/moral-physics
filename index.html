<!DOCTYPE html>
<html>
<head>
    <title>The Active Switch Paradigm</title>
    <script src="https://unpkg.com/jspsych@7.3.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
    <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>
    <script src="https://unpkg.com/@jspsych/plugin-call-function@1.1.2"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/jspsych@7.3.3/css/jspsych.css" rel="stylesheet" type="text/css" />

    <style>
        /* Estética "Black Mirror" */
        body { background-color: #0f172a; color: #e2e8f0; user-select: none; margin: 0; padding: 0; }
        
        /* Contenedor del Interruptor */
        .switch-track {
            width: 600px;
            height: 80px;
            background: #1e293b;
            border-radius: 40px;
            position: relative;
            margin: 40px auto; /* Más margen */
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            border: 2px solid #334155;
            overflow: hidden; 
        }

        /* La Manija (Handle) */
        .switch-handle {
            width: 80px;
            height: 80px;
            background: #94a3b8;
            border-radius: 50%;
            position: absolute;
            top: -2px; 
            left: 0;
            cursor: grab;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #0f172a;
            z-index: 10;
            transition: background-color 0.2s;
        }
        .switch-handle:active { cursor: grabbing; background: #f8fafc; }

        /* Barra de Progreso */
        .timer-container { width: 600px; height: 8px; background: #334155; margin: 0 auto 20px auto; border-radius: 4px; overflow: hidden; }
        .timer-bar { width: 100%; height: 100%; background: #3b82f6; transform-origin: left; transform: scaleX(1); }

        /* Debugger Error Box */
        #error-console { display: none; position: fixed; top: 0; left: 0; width: 100%; background: red; color: white; padding: 10px; z-index: 9999; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div id="error-console"></div>
    <div id="jspsych-target"></div>
</body>

<script>
    // --- SISTEMA DE DETECCIÓN DE ERRORES ---
    window.onerror = function(msg, url, line) {
        var errBox = document.getElementById('error-console');
        errBox.style.display = 'block';
        errBox.innerHTML = "ERROR CRÍTICO: " + msg + " (Línea " + line + ")";
        return false;
    };

    // --- CONFIGURACIÓN ---
    const GOOGLE_SCRIPT_URL = "PEGA_AQUI_TU_URL_DE_GOOGLE_APPS_SCRIPT"; 
    const PROLIFIC_COMPLETION_URL = "https://app.prolific.co/submissions/complete?cc=TU_CODIGO";
    // ---------------------

    const jsPsych = initJsPsych({
        display_element: 'jspsych-target'
    });

    const subject_id = jsPsych.data.getURLVariable('PROLIFIC_PID') || 'DEMO_' + Math.floor(Math.random()*100000);
    jsPsych.data.addProperties({ subject_id: subject_id });

    var timeline = [];

    // 1. DEMOGRÁFICOS
    var demographics = {
        type: jsPsychSurveyHtmlForm,
        preamble: '<h2 class="text-2xl font-bold mb-4 text-black">Participant Info</h2>',
        html: `
            <div class="text-left p-4 space-y-4 text-black">
                <label class="block">
                    <span class="font-bold">Age:</span>
                    <input type="number" name="age" required class="w-full p-2 border rounded" min="18" max="99">
                </label>
                <label class="block">
                    <span class="font-bold">Gender:</span>
                    <select name="gender" required class="w-full p-2 border rounded">
                        <option value="">Select...</option>
                        <option value="Female">Female</option>
                        <option value="Male">Male</option>
                        <option value="Other">Other</option>
                    </select>
                </label>
                <label class="block">
                    <span class="font-bold">Dominant Hand:</span>
                    <select name="handedness" required class="w-full p-2 border rounded">
                        <option value="">Select...</option>
                        <option value="Right">Right</option>
                        <option value="Left">Left</option>
                    </select>
                </label>
            </div>
        `,
        // Truco CSS para que el fondo sea blanco solo aquí
        on_load: function() { 
            document.body.style.backgroundColor = "#f3f4f6"; 
            document.getElementById('jspsych-target').style.color = "black";
        },
        on_finish: function() { 
            document.body.style.backgroundColor = "#0f172a"; 
            document.getElementById('jspsych-target').style.color = "#e2e8f0";
        }
    };
    timeline.push(demographics);

    // 2. INSTRUCCIONES
    var instructions = {
        type: jsPsychHtmlButtonResponse,
        stimulus: `
            <div class="max-w-2xl mx-auto mt-10 p-8 bg-slate-800 rounded-lg border border-slate-700 text-left">
                <h1 class="text-3xl font-bold mb-6 text-blue-400">The Active Switch Task</h1>
                <p class="mb-4 text-lg text-slate-200">This experiment measures <b>Moral Effort</b>.</p>
                <ul class="list-disc pl-6 space-y-3 mb-8 text-slate-300">
                    <li><b>Default State (Left):</b> Happens if you do nothing.</li>
                    <li><b>Active Intervention (Right):</b> Requires you to DRAG and HOLD the slider against resistance.</li>
                    <li>If you release the mouse, the slider snaps back instantly.</li>
                </ul>
                <div class="text-center p-4 bg-slate-900 rounded border border-yellow-600 text-yellow-500 font-bold">
                    You must hold your choice until the blue bar runs out.
                </div>
            </div>
        `,
        choices: ['I Understand - Start']
    };
    timeline.push(instructions);

    // 3. GENERADOR DE ENSAYOS (ARQUITECTURA SEGURA)
    function createSwitchTrial(scenario_title, left_label, right_label) {
        return {
            type: jsPsychHtmlKeyboardResponse, // Plugin base (no usa botones, usa eventos)
            choices: "NO_KEYS", // Bloqueamos teclado para forzar uso del ratón
            stimulus: `
                <div class="flex flex-col items-center justify-center pt-10 w-full h-full">
                    <h2 class="text-2xl font-bold mb-4 text-slate-200 uppercase tracking-widest">${scenario_title}</h2>
                    
                    <div class="timer-container"><div id="timer-bar" class="timer-bar"></div></div>
                    
                    <div class="flex justify-between w-[600px] mb-2 text-sm font-mono">
                        <div class="w-1/2 text-left pr-4">
                            <div class="text-red-400 font-bold mb-1">DEFAULT</div>
                            <div class="text-slate-400 zone-text">${left_label}</div>
                        </div>
                        <div class="w-1/2 text-right pl-4">
                            <div class="text-emerald-400 font-bold mb-1">INTERVENTION</div>
                            <div class="text-slate-400 zone-text">${right_label}</div>
                        </div>
                    </div>

                    <div class="switch-track" id="track">
                        <div class="switch-handle" id="handle">>>></div>
                    </div>

                    <p class="mt-8 text-slate-500 text-xs">Drag and Hold</p>
                </div>
            `,
            on_load: function() {
                // ESTA FUNCIÓN SOLO SE EJECUTA CUANDO EL HTML YA EXISTE
                // ESTO EVITA LA PANTALLA NEGRA

                const track = document.getElementById('track');
                const handle = document.getElementById('handle');
                const timerBar = document.getElementById('timer-bar');

                if (!track || !handle) {
                    console.error("Elementos no encontrados");
                    return;
                }

                // Configuración
                const DURATION = 5000;
                const trackWidth = 600;
                const handleWidth = 80;
                const maxDist = trackWidth - handleWidth;
                
                let isDragging = false;
                let currentX = 0;
                let startTime = performance.now();
                let positionData = [];
                let animationId;

                // --- Lógica del Slider ---
                function updatePosition(clientX) {
                    if (!isDragging) return;
                    
                    const rect = track.getBoundingClientRect();
                    let x = clientX - rect.left - (handleWidth / 2);
                    
                    // Límites
                    if (x < 0) x = 0;
                    if (x > maxDist) x = maxDist;
                    
                    currentX = x;
                    render();
                }

                function render() {
                    handle.style.left = currentX + 'px';
                    
                    // Feedback Visual
                    if (currentX > maxDist * 0.9) {
                        handle.style.backgroundColor = '#22c55e'; // Verde
                        handle.style.color = 'white';
                        handle.innerText = "HOLD";
                    } else {
                        handle.style.backgroundColor = '#94a3b8'; // Gris
                        handle.style.color = '#0f172a';
                        handle.innerText = ">>>";
                    }
                }

                // Listeners
                const startDrag = () => { isDragging = true; };
                const endDrag = () => { isDragging = false; currentX = 0; render(); }; // Spring effect
                const onMouseMove = (e) => updatePosition(e.clientX);
                const onTouchMove = (e) => updatePosition(e.touches[0].clientX);

                handle.addEventListener('mousedown', startDrag);
                window.addEventListener('mouseup', endDrag);
                window.addEventListener('mousemove', onMouseMove);
                
                // Soporte Touch
                handle.addEventListener('touchstart', startDrag);
                window.addEventListener('touchend', endDrag);
                window.addEventListener('touchmove', onTouchMove);

                // Bucle de Tiempo
                function loop() {
                    let elapsed = performance.now() - startTime;
                    let remaining = DURATION - elapsed;
                    
                    // Actualizar barra
                    let pct = Math.max(0, remaining / DURATION);
                    timerBar.style.transform = `scaleX(${pct})`;

                    // Guardar datos
                    positionData.push({
                        t: Math.round(elapsed),
                        p: parseFloat((currentX / maxDist).toFixed(3))
                    });

                    if (remaining > 0) {
                        animationId = requestAnimationFrame(loop);
                    } else {
                        finish();
                    }
                }

                function finish() {
                    cancelAnimationFrame(animationId);
                    // Limpiar listeners
                    window.removeEventListener('mouseup', endDrag);
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('touchend', endDrag);
                    window.removeEventListener('touchmove', onTouchMove);

                    // Calcular resultado
                    let avgEffort = positionData.reduce((acc, val) => acc + val.p, 0) / positionData.length;
                    let outcome = avgEffort > 0.5 ? "Active_Intervention" : "Default_Inaction";

                    let data = {
                        scenario: scenario_title,
                        outcome: outcome,
                        avg_effort: avgEffort,
                        trajectory: JSON.stringify(positionData)
                    };

                    jsPsych.finishTrial(data);
                }

                loop();
            }
        };
    }

    // --- ENSAYOS ---
    timeline.push(createSwitchTrial(
        "Dilemma 1: The Train",
        "Do Nothing<br>(5 Die)",
        "Pull Switch<br>(1 Dies)"
    ));
    
    timeline.push(createSwitchTrial(
        "Dilemma 2: The Bonus",
        "Keep Money<br>(+$100)",
        "Donate All<br>(Charity)"
    ));

    // 4. GUARDADO (FIRE AND FORGET - NO BLOQUEA)
    var save_screen = {
        type: jsPsychHtmlKeyboardResponse,
        choices: "NO_KEYS",
        stimulus: `
            <div class="text-center mt-20">
                <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <h2 class="text-xl">Saving Data...</h2>
            </div>
        `,
        on_load: function() {
            var data = jsPsych.data.get().json();
            
            // Envío sin esperar respuesta
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: data
            });

            // Forzar avance en 2 segundos sí o sí
            setTimeout(function() {
                jsPsych.finishTrial();
            }, 2000);
        }
    };
    timeline.push(save_screen);

    // 5. FIN
    var end_screen = {
        type: jsPsychHtmlButtonResponse,
        stimulus: `
            <div class="p-10">
                <h2 class="text-3xl text-emerald-400 mb-4">Experiment Completed</h2>
                <p class="mb-6">Thank you.</p>
            </div>
        `,
        choices: ['Finish on Prolific'],
        on_finish: function() {
            window.location = PROLIFIC_COMPLETION_URL;
        }
    };
    timeline.push(end_screen);

    jsPsych.run(timeline);

</script>
</html>
